[package]
name = "stepper-stabilizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Raspberry Pi controller for two DRV8825 stepper drivers and an MPU6050/MPU6500"
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
rppal = "0.22.1"

[profile.release]
lto = "thin"
strip = true
